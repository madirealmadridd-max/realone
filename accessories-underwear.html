<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<title>WILD CLOTHING — Underwear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root { --color-bg:#FEFCFB; --color-text:#291409; --color-muted:#6b5a52; --color-border:#eee; --frame-width:448px; }
  html, body { margin:0; padding:0; }
  body { font-family:'Inter',sans-serif; color:var(--color-text); background:#f0ece9; }
  .app { max-width:var(--frame-width); margin:0 auto; background:var(--color-bg); min-height:100vh; padding-top:56px; padding-bottom:80px; position:relative; }
  .header { display:flex; align-items:center; justify-content:space-between; height:56px; padding:0 16px; background:#fff; border-bottom:1px solid var(--color-border); }
  .header__logo { font-weight:800; font-size:16px; letter-spacing:2px; color:var(--color-text); text-decoration:none; }
  .icon-btn { width:40px; height:40px; display:flex; align-items:center; justify-content:center; background:none; border:none; cursor:pointer; color:var(--color-text); padding:0; }
  .icon-btn svg { width:22px; height:22px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .header__left, .header__right { display:flex; align-items:center; gap:8px; }

  .page-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; padding:40px 24px; text-align:center; }
  .page-empty h1 { font-size:30px; letter-spacing:3px; margin:0 0 12px; font-weight:800; }
  .page-empty p { color:var(--color-muted); font-size:14px; margin:0 0 24px; }
  .page-empty a { display:inline-block; padding:12px 28px; background:#291409; color:#fff; text-decoration:none; font-size:11px; font-weight:700; letter-spacing:2px; border-radius:2px; }

  .menu-overlay, .bag-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); opacity:0; visibility:hidden; transition:opacity .25s, visibility .25s; z-index:200; }
  .menu-overlay--open, .bag-overlay--open { opacity:1; visibility:visible; }
  .menu-drawer { position:fixed; top:0; left:max(0px, calc(50% - 224px)); width:84%; max-width:320px; height:100vh; background:#fff; transform:translateX(-100%); transition:transform .3s ease; z-index:210; display:flex; flex-direction:column; }
  .menu-drawer--open { transform:translateX(0); }
  .menu-drawer__header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--color-border); }
  .menu-drawer__title { font-size:16px; font-weight:700; letter-spacing:.5px; }
  .menu-drawer__close { width:36px; height:36px; background:none; border:none; font-size:24px; cursor:pointer; color:var(--color-text); }
  .menu-drawer__nav { flex:1; padding:8px 0; overflow-y:auto; }
  .menu-drawer__item { display:flex; align-items:center; justify-content:space-between; padding:18px 20px; text-decoration:none; color:var(--color-text); font-size:16px; font-weight:500; border-bottom:1px solid var(--color-border); }
  .menu-drawer__item--active { font-weight:700; background:#faf6f3; }
  .menu-drawer__item svg { width:16px; height:16px; stroke:var(--color-muted); stroke-width:2; fill:none; }
  .menu-drawer__group { padding:14px 20px 6px; font-size:11px; font-weight:700; letter-spacing:1.5px; color:var(--color-text); text-transform:uppercase; background:#faf6f3; border-bottom:1px solid var(--color-border); }
  .menu-drawer__footer { padding:16px 20px; border-top:1px solid var(--color-border); display:flex; gap:10px; }
  .menu-drawer__footer-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:10px; background:#291409; color:#FEFCFB; border:none; border-radius:4px; font-size:12px; font-weight:600; cursor:pointer; text-decoration:none; }

  .bag-drawer { position:fixed; top:0; right:max(0px, calc(50% - 224px)); width:84%; max-width:340px; height:100vh; background:#fff; transform:translateX(110%); transition:transform .3s ease; z-index:210; display:flex; flex-direction:column; }
  .bag-drawer--open { transform:translateX(0); }
  .bag-body { flex:1; overflow-y:auto; padding:14px 16px; }
  .bag-empty { text-align:center; padding:60px 20px; color:#999; }

  .bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:var(--frame-width); display:flex; background:#fff; border-top:1px solid var(--color-border); z-index:90; }
  .bottom-nav__item { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px; text-decoration:none; color:var(--color-muted); font-size:10px; letter-spacing:.4px; font-weight:600; }
  .bottom-nav__item svg { width:22px; height:22px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .bottom-nav__item--active { color:var(--color-text); }
</style>
</head>
<body>
<div class="app" data-shell="underwear" data-nav="">
  <section class="page-empty">
    <h1>UNDERWEAR</h1>
    <p>Underwear collection coming soon.</p>
    <a href="shop-page.html">BACK TO SHOP</a>
  </section>
</div>
<script>
(function(){
  const ICONS = {
    chev:'<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>',
    user:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
    heart:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
  };
  const BADGE='position:absolute;top:-2px;right:-4px;min-width:16px;height:16px;padding:0 4px;background:#291409;color:#FEFCFB;border-radius:8px;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1;';

  function buildHeader(active){
    return `
    <header class="header" id="header" style="position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--frame-width);z-index:100;">
      <div class="header__left"><button class="icon-btn" id="menuBtn" aria-label="Open menu"><svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button></div>
      <a href="index.html" class="header__logo">WILD CLOTHING</a>
      <div class="header__right">
        <button class="icon-btn" id="wishBtn" aria-label="Wishlist" style="position:relative;"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span data-wish-badge style="${BADGE}"></span></button>
        <button class="icon-btn" id="bagBtn" aria-label="Cart" style="position:relative;"><svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span data-bag-badge style="${BADGE}"></span></button>
      </div>
    </header>
    <div class="menu-overlay" id="menuOverlay"></div>
    <aside class="menu-drawer" id="menuDrawer">
      <div class="menu-drawer__header"><span class="menu-drawer__title">Menu</span><button class="menu-drawer__close" id="closeMenu">&times;</button></div>
      <nav class="menu-drawer__nav">
        <a href="new-arrivals-page.html" class="menu-drawer__item${active==='new'?' menu-drawer__item--active':''}">New Arrivals${ICONS.chev}</a>
        <a href="shop-page.html" class="menu-drawer__item${active==='shop'?' menu-drawer__item--active':''}">Shop${ICONS.chev}</a>
        <a href="clothing-page.html" class="menu-drawer__item${active==='clothing'?' menu-drawer__item--active':''}">Clothing${ICONS.chev}</a>
        <a href="perfumes.html" class="menu-drawer__item${active==='perfumes'?' menu-drawer__item--active':''}">Perfumes${ICONS.chev}</a>
        <a href="#" onclick="event.preventDefault();var s=this.nextElementSibling;var open=s.style.display!=='block';s.style.display=open?'block':'none';var c=this.querySelector('svg');if(c)c.style.transform=open?'rotate(90deg)':'';" class="menu-drawer__item" data-submenu-toggle="accessories">Accessories${ICONS.chev.replace('<svg ','<svg style="transition:transform 0.2s;transform:'+(['sunglasses','belt','underwear'].includes(active)?'rotate(90deg)':'')+'" ')}</a>
        <div data-submenu="accessories" style="display:${['sunglasses','belt','underwear'].includes(active)?'block':'none'};">
          <a href="accesories-sunglasses.html" style="padding-left:36px;" class="menu-drawer__item${active==='sunglasses'?' menu-drawer__item--active':''}">Sunglasses${ICONS.chev}</a>
          <a href="accesories-belt.html" style="padding-left:36px;" class="menu-drawer__item${active==='belt'?' menu-drawer__item--active':''}">Belt${ICONS.chev}</a>
          <a href="accessories-underwear.html" style="padding-left:36px;" class="menu-drawer__item${active==='underwear'?' menu-drawer__item--active':''}">Underwear${ICONS.chev}</a>
        </div>
        <a href="cart-page.html" class="menu-drawer__item${active==='cart'?' menu-drawer__item--active':''}">Cart${ICONS.chev}</a>
        <a href="sale.html" class="menu-drawer__item${active==='sale'?' menu-drawer__item--active':''}">Sale${ICONS.chev}</a>
      </nav>
      <div class="menu-drawer__footer">
        <a href="login-page.html" class="menu-drawer__footer-btn">${ICONS.user}Account</a>
        <button class="menu-drawer__footer-btn" data-open-wish>${ICONS.heart}Wishlist</button>
      </div>
    </aside>
    <div class="bag-overlay" id="wishOverlay"></div>
    <aside class="bag-drawer" id="wishDrawer">
      <div class="menu-drawer__header"><span class="menu-drawer__title">Wishlist</span><button class="menu-drawer__close" id="closeWish">&times;</button></div>
      <div class="bag-body"><div class="bag-empty"><p>Your wishlist is empty</p></div></div>
    </aside>
    <div class="bag-overlay" id="bagOverlay"></div>
    <aside class="bag-drawer" id="bagDrawer">
      <div class="menu-drawer__header"><span class="menu-drawer__title">Your Bag (<span id="bagCount">0</span>)</span><button class="menu-drawer__close" id="closeBag">&times;</button></div>
      <div class="bag-body"><div class="bag-empty"><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#bbb" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><p>Your bag is empty</p></div></div>
    </aside>`;
  }
  function buildBottomNav(){
    const i = (h,k,l,s,e='') => `<a href="${h}" class="bottom-nav__item" ${e}>${s}${l}</a>`;
    return `<nav class="bottom-nav">
      ${i('index.html','home','Home','<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>')}
      ${i('shop-page.html','shop','Shop','<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>')}
      ${i('#','wish','Wishlist','<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>','data-open-wish')}
      ${i('login-page.html','account','Account','<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>')}
    </nav>`;
  }
  function wire(){
    const $ = id => document.getElementById(id);
    const open = (d,o) => { d.classList.add('menu-drawer--open','bag-drawer--open'); o.classList.add('menu-overlay--open','bag-overlay--open'); document.body.style.overflow='hidden'; };
    const close = (d,o) => { d.classList.remove('menu-drawer--open','bag-drawer--open'); o.classList.remove('menu-overlay--open','bag-overlay--open'); document.body.style.overflow=''; };
    [['menuBtn','closeMenu','menuDrawer','menuOverlay'],['bagBtn','closeBag','bagDrawer','bagOverlay'],['wishBtn','closeWish','wishDrawer','wishOverlay']].forEach(([b,c,d,o])=>{
      const btn=$(b), cls=$(c), dr=$(d), ov=$(o);
      if(btn) btn.addEventListener('click',()=>open(dr,ov));
      if(cls) cls.addEventListener('click',()=>close(dr,ov));
      if(ov) ov.addEventListener('click',()=>close(dr,ov));
    });
    document.querySelectorAll('[data-open-wish]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();open($('wishDrawer'),$('wishOverlay'));}));
  }
  function badge(){
    let bag={}; try{bag=JSON.parse(localStorage.getItem('mwBag')||'{}');}catch(e){}
    const n=Object.values(bag).reduce((s,it)=>s+(it.qty||0),0);
    document.querySelectorAll('[data-bag-badge]').forEach(b=>{b.textContent=n;b.style.display=n>0?'flex':'none';});
    const c=document.getElementById('bagCount'); if(c) c.textContent=n;
  }
  document.addEventListener('DOMContentLoaded',()=>{
    const root=document.querySelector('[data-shell]');
    const app=document.querySelector('.app');
    app.insertAdjacentHTML('afterbegin', buildHeader(root.dataset.shell||''));
    app.insertAdjacentHTML('beforeend', buildBottomNav());
    wire(); badge();
  });
})();
</script>
</body>
</html>
