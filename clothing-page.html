<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WILD CLOTHING — Clothing</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FEFCFB;
    --text: #291409;
    --muted: #888888;
    --border: #eeeeee;
    --overlay: rgba(0,0,0,0.5);
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body {
    font-family:'Rubik',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
  }

  /* ── Drawers ── */
  .bag-overlay {
    position:fixed; inset:0; background:var(--overlay);
    opacity:0; visibility:hidden; transition:opacity .3s, visibility .3s; z-index:200;
  }
  .bag-overlay--open { opacity:1; visibility:visible; }
  .bag-drawer {
    position:fixed; top:0; bottom:0; right:0; width:90%; max-width:380px;
    background:var(--bg); transform:translateX(100%);
    transition:transform .35s cubic-bezier(.32,.72,0,1); z-index:201;
    display:flex; flex-direction:column;
  }
  .bag-drawer--open { transform:translateX(0); }
  .bag-body { flex:1; overflow-y:auto; padding:16px 20px; }
  .bag-empty {
    text-align:center; padding:60px 20px; color:#888; display:flex; flex-direction:column;
    align-items:center; gap:14px; font-size:14px; letter-spacing:.5px;
  }
  .bag-item { display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); }
  .bag-item__img { width:70px; height:90px; object-fit:cover; border-radius:6px; background:#f5f5f5; flex-shrink:0; }
  .bag-item__info { flex:1; display:flex; flex-direction:column; justify-content:space-between; min-width:0; }
  .bag-item__name { font-size:13px; font-weight:500; color:var(--text); margin:0 0 4px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .bag-item__price { font-size:13px; font-weight:600; color:var(--text); letter-spacing:.5px; }
  .bag-item__bottom { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .bag-item__qty { display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:4px; padding:2px; }
  .bag-item__qbtn { width:24px; height:24px; border:none; background:transparent; cursor:pointer; font-size:14px; color:#555; line-height:1; }
  .bag-item__qbtn:hover { color:var(--text); }
  .bag-item__qval { font-size:13px; font-weight:600; min-width:20px; text-align:center; }
  .bag-item__remove { background:none; border:none; cursor:pointer; color:#999; font-size:11px; letter-spacing:.8px; text-transform:uppercase; text-decoration:underline; padding:0; }
  .bag-item__remove:hover { color:#e53935; }
  .bag-footer { padding:18px 20px; border-top:1px solid var(--border); }
  .bag-total { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-size:15px; font-weight:600; color:var(--text); letter-spacing:.5px; }
  .bag-checkout-btn {
    width:100%; padding:14px; background:var(--text); color:#fff; border:none; border-radius:6px;
    font-size:13px; font-weight:600; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:background .3s;
  }
  .bag-checkout-btn:hover { background:#3d1f0e; }
  .menu-drawer__header {
    padding:20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;
  }
  .menu-drawer__title { font-size:16px; font-weight:700; letter-spacing:.5px; }
  .menu-drawer__close { width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:none; border:none; font-size:24px; cursor:pointer; color:var(--text); }

  /* ── Floating actions ── */
  .mw-embed-actions {
    position:fixed; bottom:22px; right:22px; display:flex; flex-direction:column; gap:12px; z-index:150;
  }
  .mw-embed-btn {
    width:54px; height:54px; border-radius:50%; background:var(--text); color:#FEFCFB; border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 6px 22px rgba(41,20,9,.25); position:relative; transition:transform .2s ease;
  }
  .mw-embed-btn:active { transform:scale(.92); }
  .mw-embed-btn svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .mw-badge {
    position:absolute; top:-4px; right:-4px; min-width:18px; height:18px; padding:0 5px;
    background:#e53935; color:#fff; border-radius:9px; font-size:11px; font-weight:700;
    display:none; align-items:center; justify-content:center; line-height:1;
  }

  /* ── Shop ── */
  .mw-shop { width:100%; max-width:1400px; margin:0 auto; padding:24px 16px 80px; }
  .mw-shop a { text-decoration:none; color:inherit; }
  .mw-shop img { display:block; max-width:100%; }
  .mw-shop button { cursor:pointer; font-family:inherit; }

  .mw-title { text-align:center; font-size:1.5rem; font-weight:700; letter-spacing:4px; text-transform:uppercase; margin:0 0 6px; color:var(--text); }
  .mw-count { text-align:center; font-size:.8rem; color:var(--muted); letter-spacing:1px; margin-bottom:24px; }

  .mw-filters { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-bottom:32px; }
  .mw-fbtn {
    padding:8px 20px; border:1px solid rgba(41,20,9,.12); border-radius:40px; background:transparent;
    color:#555; font-size:.72rem; font-weight:600; letter-spacing:1.4px; text-transform:uppercase;
    transition:all .35s cubic-bezier(.4,0,.2,1); white-space:nowrap;
  }
  .mw-fbtn:hover { border-color:var(--text); color:var(--text); }
  .mw-fbtn.active { background:var(--text); border-color:var(--text); color:#fff; }
  .mw-fbtn:active { transform:scale(.95); }

  .mw-grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:20px;
    position:relative; transition:opacity .35s cubic-bezier(.4,0,.2,1), transform .45s cubic-bezier(.4,0,.2,1);
  }
  .mw-grid.slide-out { opacity:0; transform:translateX(-30px); pointer-events:none; }
  .mw-grid.slide-in  { opacity:0; transform:translateX(30px); }

  .mw-card {
    background:#fff; border-radius:var(--radius); overflow:hidden; border:1px solid rgba(0,0,0,.06);
    transition:all .35s cubic-bezier(.16,1,.3,1); position:relative; opacity:0; transform:translateY(30px) scale(.97);
  }
  .mw-card.mw-visible { animation:mwSlideUp .5s cubic-bezier(.25,.46,.45,.94) forwards; }
  .mw-card:hover { transform:translateY(-4px); border-color:rgba(0,0,0,.12); box-shadow:var(--shadow); }
  .mw-imgwrap { position:relative; overflow:hidden; aspect-ratio:3/4; background:#f5f5f5; }
  .mw-imgwrap img { width:100%; height:100%; object-fit:cover; transition:transform .5s ease; }
  .mw-card:hover .mw-imgwrap img { transform:scale(1.05); }

  .mw-wish {
    position:absolute; top:10px; right:10px; z-index:5; width:32px; height:32px; border-radius:50%;
    background:rgba(255,255,255,.92); backdrop-filter:blur(4px); border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.1); transition:all .3s ease;
  }
  .mw-wish:active { transform:scale(.9); }
  .mw-wish svg { width:14px; height:14px; fill:none; stroke:var(--text); stroke-width:2; }
  .mw-wish.active svg { fill:#e53935; stroke:#e53935; }

  .mw-bag-overlay {
    position:absolute; bottom:0; left:0; right:0; padding:12px;
    background:linear-gradient(transparent, rgba(0,0,0,.8));
    opacity:0; transform:translateY(10px); transition:all .3s ease;
  }
  .mw-card:hover .mw-bag-overlay { opacity:1; transform:translateY(0); }
  .mw-bag-btn {
    width:100%; padding:10px; border:none; border-radius:6px; background:var(--text); color:#fff;
    font-size:.72rem; font-weight:600; letter-spacing:2px; text-transform:uppercase; transition:background .3s;
  }
  .mw-bag-btn:hover { background:#3d1f0e; }

  .mw-info { padding:14px; }
  .mw-name { font-size:.82rem; font-weight:500; letter-spacing:.3px; color:var(--text); margin-bottom:5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.4em; line-height:1.35; }
  .mw-price { font-size:.85rem; font-weight:600; color:var(--muted); letter-spacing:.5px; }

  .mw-pages { display:flex; justify-content:center; align-items:center; gap:8px; margin-top:40px; }
  .mw-pbtn {
    min-width:40px; height:40px; border-radius:8px; border:1px solid var(--border); background:transparent;
    color:var(--muted); font-size:.85rem; font-weight:500; display:flex; align-items:center; justify-content:center;
    transition:all .3s cubic-bezier(.4,0,.2,1);
  }
  .mw-pbtn:hover { border-color:var(--text); color:var(--text); }
  .mw-pbtn.active { background:var(--text); border-color:var(--text); color:#fff; }
  .mw-pbtn.disabled { opacity:.3; pointer-events:none; }
  .mw-pbtn:active { transform:scale(.92); }

  .mw-empty { grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--muted); font-size:.9rem; letter-spacing:1px; }

  .mw-toast {
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(80px);
    background:var(--text); color:#fff; padding:10px 28px; border-radius:24px;
    font-size:.8rem; font-weight:600; letter-spacing:.5px; z-index:9999;
    transition:transform .4s ease; pointer-events:none; box-shadow:0 6px 24px rgba(41,20,9,.35);
  }
  .mw-toast.show { transform:translateX(-50%) translateY(0); }

  @keyframes mwSlideUp {
    from { opacity:0; transform:translateY(30px) scale(.97); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }

  @media (max-width:640px) {
    .mw-grid { grid-template-columns:repeat(2,1fr); gap:12px; }
    .mw-info { padding:10px; }
    .mw-name { font-size:.72rem; }
    .mw-price { font-size:.75rem; }
    .mw-filters { gap:6px; }
    .mw-fbtn { padding:6px 14px; font-size:.65rem; }
    .bag-drawer { width:100%; max-width:none; }
  }
</style>
<base target="_blank">
</head>

const SUBS = {
  clothing:[{k:'all',l:'All Clothing'},{k:'jackets',l:'Jackets'},{k:'gilet',l:'Gilet'},{k:'shirts',l:'Shirts'},{k:'hoodies',l:'Hoodies'},{k:'t-shirt',l:'T-Shirts'},{k:'sweaters',l:'Sweaters'},{k:'knitted-tee-shirt',l:'Knitted Tees'},{k:'sweatshirts',l:'Sweatshirts'}]
};

let mwCat='clothing', mwSub='all', mwPage=1;
const PER_PAGE=40;
let mwAnimating=false;

function mwFiltered(){
  let l = MW_PRODUCTS;
  if(mwCat !== 'all') l = l.filter(p => p.cat === mwCat);
  if(mwSub !== 'all') l = l.filter(p => p.sub === mwSub);
  return l;
}

function $(id){ return document.getElementById(id); }

function mwRender(skipAnim){
  const f = mwFiltered(), tp = Math.ceil(f.length/PER_PAGE);
  if(mwPage>tp) mwPage = tp||1;
  const s = (mwPage-1)*PER_PAGE, items = f.slice(s,s+PER_PAGE);

  // Count
  const cnt = $('mw-count');
  if(cnt) cnt.textContent = f.length + (f.length===1?' product':' products');

  // Filters
  const fc = $('mw-filters'), subs = SUBS[mwCat]||[];
  let fh = subs.map(sx => `<button class="mw-fbtn ${mwSub===sx.k?'active':''}" onclick="mwSetSub('${sx.k}')">${sx.l}</button>`).join('');
  fc.innerHTML = fh;

  // Grid
  const g = $('mw-grid');
  const html = items.length ? items.map(p => `
    <div class="mw-card" id="mw-p${p.id}">
      <a href="${p.link}" target="_blank" rel="noopener">
        <div class="mw-imgwrap">
          <img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22400%22><rect fill=%22%23f5f5f5%22 width=%22300%22 height=%22400%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23888%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2214%22>No Image</text></svg>'">
          <button class="mw-wish" data-pid="${p.id}" onclick="event.preventDefault();event.stopPropagation();mwToggleWish(${p.id},this)">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </button>
          <div class="mw-bag-overlay">
            <button class="mw-bag-btn" onclick="event.preventDefault();event.stopPropagation();mwAddToBag(${p.id})">Add to Bag</button>
          </div>
        </div>
        <div class="mw-info">
          <h3 class="mw-name">${p.name}</h3>
          <p class="mw-price">${p.price}</p>
        </div>
      </a>
    </div>`).join('') : '<div class="mw-empty">No products found.</div>';

  if(!skipAnim && !mwAnimating){
    mwAnimating=true;
    g.classList.add('slide-out');
    setTimeout(()=>{
      g.innerHTML = html;
      g.classList.remove('slide-out');
      g.classList.add('slide-in');
      void g.offsetWidth;
      g.classList.remove('slide-in');
      mwRevealCards();
      syncHearts();
      mwAnimating=false;
    },350);
  } else {
    g.innerHTML = html;
    mwRevealCards();
    syncHearts();
  }

  // Pagination
  const pc = $('mw-pages');
  if(tp<=1){ pc.innerHTML=''; return; }
  let ph = `<button class="mw-pbtn ${mwPage===1?'disabled':''}" onclick="mwGo(${mwPage-1})">‹</button>`;
  for(let i=1;i<=tp;i++) ph += `<button class="mw-pbtn ${i===mwPage?'active':''}" onclick="mwGo(${i})">${i}</button>`;
  ph += `<button class="mw-pbtn ${mwPage===tp?'disabled':''}" onclick="mwGo(${mwPage+1})">›</button>`;
  pc.innerHTML = ph;
}

function mwRevealCards(){
  document.querySelectorAll('.mw-card:not(.mw-visible)').forEach((c,i)=>{
    setTimeout(()=>c.classList.add('mw-visible'), i*50);
  });
}

function mwSetSub(s){ mwSub=s; mwPage=1; mwRender(); }
function mwGo(p){ const f=mwFiltered(), tp=Math.ceil(f.length/PER_PAGE); if(p<1||p>tp)return; mwPage=p; mwRender(); $('mw-filters').scrollIntoView({behavior:'smooth'}); }

/* ═══════════════════════════════════════════════════════════════════
   CART & WISHLIST
   ═══════════════════════════════════════════════════════════════════ */
let MW_WISH = new Set();
let MW_BAG  = {};
try { MW_WISH = new Set(JSON.parse(localStorage.getItem('mwWishlist')||'[]')); } catch(e){}
try { MW_BAG  = JSON.parse(localStorage.getItem('mwBag')||'{}'); } catch(e){}

function priceNum(p){ return parseFloat(String(p).replace(/[^0-9.]/g,''))||0; }
function bagCount(){ return Object.values(MW_BAG).reduce((s,it)=>s+it.qty,0); }
function bagTotal(){ return Object.values(MW_BAG).reduce((s,it)=>s+priceNum(it.price)*it.qty,0); }
function saveBag(){ try{ localStorage.setItem('mwBag', JSON.stringify(MW_BAG)); }catch(e){} }
function saveWish(){ try{ localStorage.setItem('mwWishlist', JSON.stringify([...MW_WISH])); }catch(e){} }

function updateBadges(){
  const c=bagCount(), w=MW_WISH.size;
  document.querySelectorAll('[data-bag-badge]').forEach(b=>{
    b.textContent=c; b.style.display=c>0?'flex':'none';
  });
  document.querySelectorAll('[data-wish-badge]').forEach(b=>{
    b.textContent=w; b.style.display=w>0?'flex':'none';
  });
  const bc=$('bagCount'); if(bc) bc.textContent=c;
  const wc=$('wishHeaderCount'); if(wc) wc.textContent=w;
}

function renderBag(){
  const body=$('bagBody'), foot=$('bagFooter');
  if(!body) return;
  const ids=Object.keys(MW_BAG);
  if(ids.length===0){
    body.innerHTML='<div class="bag-empty"><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#bbb" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><p>Your bag is empty</p></div>';
    if(foot) foot.style.display='none';
    return;
  }
  body.innerHTML = ids.map(id=>{
    const it=MW_BAG[id];
    return `<div class="bag-item">
      <img class="bag-item__img" src="${it.img}" alt="${it.name}" onerror="this.style.background='#eee'">
      <div class="bag-item__info">
        <div>
          <h4 class="bag-item__name">${it.name}</h4>
          <p class="bag-item__price">${it.price}</p>
        </div>
        <div class="bag-item__bottom">
          <div class="bag-item__qty">
            <button class="bag-item__qbtn" onclick="mwBagQty('${id}',-1)">−</button>
            <span class="bag-item__qval">${it.qty}</span>
            <button class="bag-item__qbtn" onclick="mwBagQty('${id}',1)">+</button>
          </div>
          <button class="bag-item__remove" onclick="mwBagRemove('${id}')">Remove</button>
        </div>
      </div>
    </div>`;
  }).join('');
  const tt=$('bagTotal'); if(tt) tt.textContent = bagTotal().toFixed(2)+' DH';
  if(foot) foot.style.display='block';
}

function renderWish(){
  const body=$('wishBody'); if(!body) return;
  const ids=[...MW_WISH];
  if(ids.length===0){
    body.innerHTML='<div class="bag-empty"><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#bbb" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><p>Your wishlist is empty</p></div>';
    return;
  }
  body.innerHTML = ids.map(id=>{
    const p=MW_PRODUCTS.find(x=>String(x.id)===String(id));
    if(!p) return '';
    return `<div class="bag-item">
      <img class="bag-item__img" src="${p.img}" alt="${p.name}" onerror="this.style.background='#eee'">
      <div class="bag-item__info">
        <div>
          <h4 class="bag-item__name">${p.name}</h4>
          <p class="bag-item__price">${p.price}</p>
        </div>
        <div class="bag-item__bottom">
          <button class="bag-item__remove" onclick="mwAddToBag(${p.id})" style="color:#291409;font-weight:600;">+ Add to Bag</button>
          <button class="bag-item__remove" onclick="mwWishRemove('${id}')">Remove</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function syncHearts(){
  document.querySelectorAll('.mw-wish').forEach(b=>{
    const dp=b.getAttribute('data-pid');
    if(!dp) return;
    if(MW_WISH.has(String(dp))) b.classList.add('active');
    else b.classList.remove('active');
  });
}

window.mwToggleWish = function(id, btn){
  id=String(id);
  if(MW_WISH.has(id)) MW_WISH.delete(id);
  else MW_WISH.add(id);
  saveWish(); updateBadges(); renderWish(); syncHearts();
};
window.mwWishRemove = function(id){
  MW_WISH.delete(String(id));
  saveWish(); updateBadges(); renderWish(); syncHearts();
};
window.mwAddToBag = function(id){
  id=String(id);
  const p=MW_PRODUCTS.find(x=>String(x.id)===id); if(!p) return;
  if(MW_BAG[id]) MW_BAG[id].qty++;
  else MW_BAG[id]={name:p.name, price:p.price, img:p.img, qty:1};
  saveBag(); updateBadges(); renderBag(); toast();
};
window.mwBagQty = function(id,delta){
  if(!MW_BAG[id]) return;
  MW_BAG[id].qty += delta;
  if(MW_BAG[id].qty<=0) delete MW_BAG[id];
  saveBag(); updateBadges(); renderBag();
};
window.mwBagRemove = function(id){
  delete MW_BAG[id]; saveBag(); updateBadges(); renderBag();
};

function toast(){
  let t=$('mwGlobalToast');
  if(!t){
    t=document.createElement('div');
    t.id='mwGlobalToast';
    t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#291409;color:#FEFCFB;padding:10px 18px;border-radius:24px;font-size:.85rem;font-weight:600;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 6px 24px rgba(41,20,9,.4);';
    document.body.appendChild(t);
  }
  t.textContent='Added to bag!';
  t.style.opacity='1';
  clearTimeout(window._mwToastT);
  window._mwToastT=setTimeout(()=>{ t.style.opacity='0'; },1800);
}

/* ═══════════════════════════════════════════════════════════════════
   DRAWER WIRING
   ═══════════════════════════════════════════════════════════════════ */
(function(){
  const open=(d,o)=>{ d.classList.add('bag-drawer--open'); o.classList.add('bag-overlay--open'); document.body.style.overflow='hidden'; };
  const close=(d,o)=>{ d.classList.remove('bag-drawer--open'); o.classList.remove('bag-overlay--open'); document.body.style.overflow=''; };
  const pairs=[ ['bagBtn','closeBag','bagDrawer','bagOverlay'], ['wishBtn','closeWish','wishDrawer','wishOverlay'] ];
  pairs.forEach(([b,c,d,o])=>{
    const btn=$(b), cls=$(c), dr=$(d), ov=$(o);
    if(btn) btn.addEventListener('click',()=>{ open(dr,ov); if(d==='bagDrawer') renderBag(); if(d==='wishDrawer') renderWish(); });
    if(cls) cls.addEventListener('click',()=>close(dr,ov));
    if(ov)  ov.addEventListener('click',()=>close(dr,ov));
  });
})();

/* ═══════════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════════ */
mwRender(true);
updateBadges();
renderBag();
renderWish();
syncHearts();
</script>
