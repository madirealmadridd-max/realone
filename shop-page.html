<title>Shop — WILD CLOTHING</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FEFCFB;--text:#291409;--muted:#888;--border:#eee;--overlay:rgba(0,0,0,.5)}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Rubik',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased}
  .mw-embed-actions{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:12px;z-index:150}
  .mw-embed-btn{width:54px;height:54px;border-radius:50%;background:var(--text);color:#FEFCFB;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 22px rgba(41,20,9,.25);position:relative;transition:transform .2s}
  .mw-embed-btn:active{transform:scale(.92)}
  .mw-embed-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .mw-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;background:#e53935;color:#fff;border-radius:9px;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1}
  .bag-overlay{position:fixed;inset:0;background:var(--overlay);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:200}
  .bag-overlay--open{opacity:1;visibility:visible}
  .bag-drawer{position:fixed;top:0;bottom:0;right:0;width:90%;max-width:380px;background:var(--bg);transform:translateX(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);z-index:201;display:flex;flex-direction:column}
  .bag-drawer--open{transform:translateX(0)}
  .bag-body{flex:1;overflow-y:auto;padding:16px 20px}
  .bag-empty{text-align:center;padding:60px 20px;color:#888;display:flex;flex-direction:column;align-items:center;gap:14px;font-size:14px;letter-spacing:.5px}
  .bag-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
  .bag-item__img{width:70px;height:90px;object-fit:cover;border-radius:6px;background:#f5f5f5;flex-shrink:0}
  .bag-item__info{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
  .bag-item__name{font-size:13px;font-weight:500;color:var(--text);margin:0 0 4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .bag-item__price{font-size:13px;font-weight:600;color:var(--text);letter-spacing:.5px}
  .bag-item__bottom{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
  .bag-item__qty{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:4px;padding:2px}
  .bag-item__qbtn{width:24px;height:24px;border:none;background:transparent;cursor:pointer;font-size:14px;color:#555;line-height:1}
  .bag-item__qbtn:hover{color:var(--text)}
  .bag-item__qval{font-size:13px;font-weight:600;min-width:20px;text-align:center}
  .bag-item__remove{background:none;border:none;cursor:pointer;color:#999;font-size:11px;letter-spacing:.8px;text-transform:uppercase;text-decoration:underline;padding:0}
  .bag-item__remove:hover{color:#e53935}
  .bag-footer{padding:18px 20px;border-top:1px solid var(--border)}
  .bag-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:15px;font-weight:600;color:var(--text);letter-spacing:.5px}
  .bag-checkout-btn{width:100%;padding:14px;background:var(--text);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background .3s}
  .bag-checkout-btn:hover{background:#3d1f0e}
  .menu-drawer__header{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .menu-drawer__title{font-size:16px;font-weight:700;letter-spacing:.5px}
  .menu-drawer__close{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;font-size:24px;cursor:pointer;color:var(--text)}
  .shop-page{padding:16px 0 80px}
  .shop-hero{padding:16px 16px 8px;text-align:center}
  .shop-hero h1{font-size:1.4rem;letter-spacing:1.5px;margin:0 0 4px;color:var(--text)}
  .shop-hero p{font-size:.82rem;color:var(--muted);margin:0}
  .shop-section{margin:18px 0}
  .shop-section__head{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px 10px}
  .shop-section__title{font-size:1rem;letter-spacing:1.2px;font-weight:600;color:var(--text);margin:0}
  .shop-section__more{font-size:.72rem;color:var(--muted);text-decoration:none;letter-spacing:.6px}
  .ac-wrap{position:relative;overflow:hidden;padding:0 12px}
  .ac-track{display:flex;transition:transform .55s cubic-bezier(.4,0,.2,1);will-change:transform}
  .ac-slide{flex:0 0 100%;padding:0 4px;box-sizing:border-box}
  .ac-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .ac-card{background:#fff;border-radius:12px;overflow:hidden;cursor:pointer}
  .ac-imgwrap{position:relative;aspect-ratio:4/5;overflow:hidden;background:#f5f5f5}
  .ac-imgwrap img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
  .ac-card:hover .ac-imgwrap img{transform:scale(1.04)}
  .ac-wish{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;padding:0}
  .ac-wish svg{width:16px;height:16px;stroke:#291409;fill:none;stroke-width:2}
  .ac-wish.active svg{fill:#291409}
  .ac-bag-overlay{position:absolute;left:0;right:0;bottom:0;padding:6px;background:linear-gradient(to top,rgba(0,0,0,.5),transparent);opacity:0;transition:opacity .25s}
  .ac-card:hover .ac-bag-overlay{opacity:1}
  .ac-bag-btn{width:100%;padding:8px;background:#fff;color:#291409;border:none;border-radius:6px;font-size:.72rem;font-weight:700;letter-spacing:.5px;cursor:pointer}
  .ac-info{padding:8px 6px 6px}
  .ac-name{margin:0 0 2px;font-size:.78rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ac-price{margin:0;font-size:.72rem;color:var(--muted);font-weight:500}
  .ac-dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
  .ac-dot{width:6px;height:6px;border-radius:50%;background:rgba(41,20,9,.2);transition:all .3s;cursor:pointer}
  .ac-dot.active{background:#291409;width:18px;border-radius:3px}
  .mw-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:10px 28px;border-radius:24px;font-size:.8rem;font-weight:600;letter-spacing:.5px;z-index:9999;transition:transform .4s;pointer-events:none;box-shadow:0 6px 24px rgba(41,20,9,.35)}
  .mw-toast.show{transform:translateX(-50%) translateY(0)}
  @media(max-width:640px){.bag-drawer{width:100%;max-width:none}}
</style>
</head>

let MW_WISH=new Set();
let MW_BAG={};
try{MW_WISH=new Set(JSON.parse(localStorage.getItem('mwWishlist')||'[]'))}catch(e){}
try{MW_BAG=JSON.parse(localStorage.getItem('mwBag')||'{}')}catch(e){}

function $(id){return document.getElementById(id)}
function priceNum(p){return parseFloat(String(p).replace(/[^0-9.]/g,''))||0}
function bagCount(){return Object.values(MW_BAG).reduce((s,it)=>s+it.qty,0)}
function bagTotal(){return Object.values(MW_BAG).reduce((s,it)=>s+priceNum(it.price)*it.qty,0)}
function saveBag(){try{localStorage.setItem('mwBag',JSON.stringify(MW_BAG))}catch(e){}}
function saveWish(){try{localStorage.setItem('mwWishlist',JSON.stringify([...MW_WISH]))}catch(e){}}

function updateBadges(){
  const c=bagCount(),w=MW_WISH.size;
  document.querySelectorAll('[data-bag-badge]').forEach(b=>{b.textContent=c;b.style.display=c>0?'flex':'none'});
  document.querySelectorAll('[data-wish-badge]').forEach(b=>{b.textContent=w;b.style.display=w>0?'flex':'none'});
  const bc=$('bagCount');if(bc)bc.textContent=c;
  const wc=$('wishHeaderCount');if(wc)wc.textContent=w;
}

function renderBag(){
  const body=$('bagBody'),foot=$('bagFooter');
  if(!body)return;
  const ids=Object.keys(MW_BAG);
  if(ids.length===0){
    body.innerHTML='<div class="bag-empty"><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#bbb" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><p>Your bag is empty</p></div>';
    if(foot)foot.style.display='none';
    return;
  }
  body.innerHTML=ids.map(id=>{
    const it=MW_BAG[id];
    return `<div class="bag-item"><img class="bag-item__img" src="${it.img}" alt="${it.name}" onerror="this.style.background='#eee'"><div class="bag-item__info"><div><h4 class="bag-item__name">${it.name}</h4><p class="bag-item__price">${it.price}</p></div><div class="bag-item__bottom"><div class="bag-item__qty"><button class="bag-item__qbtn" onclick="mwBagQty('${id}',-1)">−</button><span class="bag-item__qval">${it.qty}</span><button class="bag-item__qbtn" onclick="mwBagQty('${id}',1)">+</button></div><button class="bag-item__remove" onclick="mwBagRemove('${id}')">Remove</button></div></div></div>`;
  }).join('');
  const tt=$('bagTotal');if(tt)tt.textContent=bagTotal().toFixed(2)+' DH';
  if(foot)foot.style.display='block';
}

function renderWish(){
  const body=$('wishBody');if(!body)return;
  const ids=[...MW_WISH];
  if(ids.length===0){
    body.innerHTML='<div class="bag-empty"><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#bbb" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><p>Your wishlist is empty</p></div>';
    return;
  }
  body.innerHTML=ids.map(id=>{
    const p=MW_PRODUCTS.find(x=>String(x.id)===String(id));
    if(!p)return'';
    return `<div class="bag-item"><img class="bag-item__img" src="${p.img}" alt="${p.name}" onerror="this.style.background='#eee'"><div class="bag-item__info"><div><h4 class="bag-item__name">${p.name}</h4><p class="bag-item__price">${p.price}</p></div><div class="bag-item__bottom"><button class="bag-item__remove" onclick="mwAddToBag(${p.id})" style="color:#291409;font-weight:600">+ Add to Bag</button><button class="bag-item__remove" onclick="mwWishRemove('${id}')">Remove</button></div></div></div>`;
  }).join('');
}

function syncHearts(){
  document.querySelectorAll('.ac-wish').forEach(b=>{
    const dp=b.getAttribute('data-pid');
    if(!dp)return;
    if(MW_WISH.has(String(dp)))b.classList.add('active');
    else b.classList.remove('active');
  });
}

window.mwToggleWish=function(id,btn){
  id=String(id);
  if(MW_WISH.has(id))MW_WISH.delete(id);else MW_WISH.add(id);
  saveWish();updateBadges();renderWish();syncHearts();
};
window.mwWishRemove=function(id){
  MW_WISH.delete(String(id));
  saveWish();updateBadges();renderWish();syncHearts();
};
window.mwAddToBag=function(id){
  id=String(id);
  const p=MW_PRODUCTS.find(x=>String(x.id)===id);if(!p)return;
  if(MW_BAG[id])MW_BAG[id].qty++;else MW_BAG[id]={name:p.name,price:p.price,img:p.img,qty:1};
  saveBag();updateBadges();renderBag();toast();
};
window.mwBagQty=function(id,delta){
  if(!MW_BAG[id])return;
  MW_BAG[id].qty+=delta;
  if(MW_BAG[id].qty<=0)delete MW_BAG[id];
  saveBag();updateBadges();renderBag();
};
window.mwBagRemove=function(id){
  delete MW_BAG[id];saveBag();updateBadges();renderBag();
};

function toast(){
  let t=$('mw-toast');
  if(!t){
    t=document.createElement('div');
    t.id='mw-toast';
    t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#291409;color:#FEFCFB;padding:10px 18px;border-radius:24px;font-size:.85rem;font-weight:600;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 6px 24px rgba(41,20,9,.4)';
    document.body.appendChild(t);
  }
  t.textContent='Added to bag!';
  t.style.opacity='1';
  clearTimeout(window._mwToastT);
  window._mwToastT=setTimeout(()=>{t.style.opacity='0'},1800);
}

(function(){
  const open=(d,o)=>{d.classList.add('bag-drawer--open');o.classList.add('bag-overlay--open');document.body.style.overflow='hidden'};
  const close=(d,o)=>{d.classList.remove('bag-drawer--open');o.classList.remove('bag-overlay--open');document.body.style.overflow=''};
  const pairs=[['bagBtn','closeBag','bagDrawer','bagOverlay'],['wishBtn','closeWish','wishDrawer','wishOverlay']];
  pairs.forEach(([b,c,d,o])=>{
    const btn=$(b),cls=$(c),dr=$(d),ov=$(o);
    if(btn)btn.addEventListener('click',()=>{open(dr,ov);if(d==='bagDrawer')renderBag();if(d==='wishDrawer')renderWish()});
    if(cls)cls.addEventListener('click',()=>close(dr,ov));
    if(ov)ov.addEventListener('click',()=>close(dr,ov));
  });
})();

const SHOP_SECTIONS=[
  {id:"outerwear",title:"OUTERWEAR",filter:p=>p.cat==="clothing"&&(p.sub==="jackets"||p.sub==="gilet")},
  {id:"hoodies",title:"HOODIES",filter:p=>p.sub==="hoodies"},
  {id:"sweatshirts",title:"SWEATSHIRTS",filter:p=>p.sub==="sweatshirts"},
  {id:"tshirts",title:"T-SHIRTS",filter:p=>p.sub==="t-shirt"||p.sub==="knitted-tee-shirt"},
  {id:"shirts",title:"SHIRTS",filter:p=>p.sub==="shirts"},
  {id:"knitwear",title:"KNITWEAR",filter:p=>p.sub==="sweaters"},
  {id:"sunglasses",title:"SUNGLASSES",filter:p=>p.cat==="sunglasses"},
  {id:"perfumes",title:"PARFUM COMPLET",filter:p=>p.sub==="parfum-complet"},
  {id:"french-avenue",title:"FRENCH AVENUE",filter:p=>p.sub==="french-avenue"}
];
const PER_SLIDE=2;

function buildCard(p){
  const safe=(p.name||"").replace(/"/g,"&quot;");
  return `<div class="ac-card" onclick="window.open('${p.link}','_blank')"><div class="ac-imgwrap"><img src="${p.img}" alt="${safe}" loading="lazy" onerror="this.style.background='#eee'"><button class="ac-wish" data-pid="${p.id}" onclick="event.stopPropagation();mwToggleWish(${p.id},this)" aria-label="Wishlist"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button><div class="ac-bag-overlay"><button class="ac-bag-btn" onclick="event.stopPropagation();mwAddToBag(${p.id})">Add to Bag</button></div></div><div class="ac-info"><p class="ac-name">${p.name}</p><p class="ac-price">${p.price}</p></div></div>`;
}

function buildSection(sec,items){
  if(!items.length)return'';
  const slides=[];
  for(let i=0;i<items.length;i+=PER_SLIDE){
    const chunk=items.slice(i,i+PER_SLIDE);
    slides.push(`<div class="ac-slide"><div class="ac-grid">${chunk.map(buildCard).join("")}</div></div>`);
  }
  const dots=slides.map((_,i)=>`<span class="ac-dot${i===0?" active":""}" data-dot="${i}"></span>`).join("");
  const more=sec.id==="outerwear"?"https://mywildclothing.com/collections/clothing":sec.id==="sunglasses"?"https://mywildclothing.com/collections/sunglasses":sec.id==="perfumes"||sec.id==="french-avenue"?"https://mywildclothing.com/collections/perfumes":"https://mywildclothing.com/collections/clothing";
  return `<section class="shop-section" id="${sec.id}"><div class="shop-section__head"><h2 class="shop-section__title">${sec.title}</h2><a href="${more}" target="_blank" class="shop-section__more">View all →</a></div><div class="ac-wrap" data-carousel="${sec.id}"><div class="ac-track">${slides.join("")}</div></div><div class="ac-dots" data-dots-for="${sec.id}">${dots}</div></section>`;
}

function initCarousel(wrap){
  const track=wrap.querySelector(".ac-track");
  const slides=track.children;
  const total=slides.length;
  if(total<=1)return;
  const id=wrap.getAttribute("data-carousel");
  const dotsRow=document.querySelector(`[data-dots-for="${id}"]`);
  const dots=dotsRow?dotsRow.querySelectorAll(".ac-dot"):[];
  let idx=0,paused=false;
  const go=(i)=>{idx=(i+total)%total;track.style.transform=`translateX(-${idx*100}%)`;dots.forEach((d,j)=>d.classList.toggle("active",j===idx))};
  dots.forEach((d,j)=>d.addEventListener("click",()=>{go(j);reset()}));
  let timer=setInterval(()=>{if(!paused)go(idx+1)},3500);
  function reset(){clearInterval(timer);timer=setInterval(()=>{if(!paused)go(idx+1)},3500)}
  wrap.addEventListener("mouseenter",()=>paused=true);
  wrap.addEventListener("mouseleave",()=>paused=false);
  let sx=0,dx=0;
  wrap.addEventListener("touchstart",(e)=>{sx=e.touches[0].clientX;dx=0;paused=true},{passive:true});
  wrap.addEventListener("touchmove",(e)=>{dx=e.touches[0].clientX-sx},{passive:true});
  wrap.addEventListener("touchend",()=>{if(Math.abs(dx)>40){go(idx+(dx<0?1:-1));reset()}paused=false});
}

document.addEventListener("DOMContentLoaded",()=>{
  updateBadges();renderBag();renderWish();syncHearts();
  const root=document.getElementById("shopRoot");
  const sections=SHOP_SECTIONS.map(sec=>buildSection(sec,MW_PRODUCTS.filter(sec.filter))).join("");
  root.innerHTML=sections;
  document.querySelectorAll("[data-carousel]").forEach(initCarousel);
  if(location.hash==="#perfumes"){
    setTimeout(()=>document.getElementById("perfumes")?.scrollIntoView({behavior:"smooth",block:"start"}),200);
  }
});
</script>
