<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checkout — WILD CLOTHING</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --frame-width: 448px;
            --color-bg: #FEFCFB;
            --color-text: #291409;
            --color-muted: #888888;
            --color-border: #eeeeee;
            --brand: #291409;
            --header-height: 56px;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }
        html { background: #FEFCFB; }
        body {
            font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100dvh;
        }
        .app {
            max-width: var(--frame-width);
            margin: 0 auto;
            position: relative;
            background: var(--color-bg);
            min-height: 100dvh;
        }
        .header {
            position: sticky; top: 0;
            height: calc(var(--header-height) + var(--safe-top));
            padding-top: var(--safe-top);
            background: rgba(255,255,255,0.96);
            backdrop-filter: saturate(180%) blur(12px);
            border-bottom: 1px solid var(--color-border);
            display: flex; align-items: center; justify-content: space-between;
            padding-left: 8px; padding-right: 8px;
            z-index: 10;
        }
        .header__back {
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            background: none; border: none; cursor: pointer; color: var(--color-text);
        }
        .header__back svg { width:22px; height:22px; stroke: currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .header__title {
            font-size: 16px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
        }
        .header__spacer { width: 44px; }
        .container { padding: 20px 20px calc(40px + var(--safe-bottom)); }

        .section-title {
            font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
            color: var(--color-muted); margin: 24px 0 12px;
        }
        .section-title:first-child { margin-top: 4px; }

        .summary { border: 1px solid var(--color-border); border-radius: 10px; padding: 14px; }
        .summary-empty { text-align: center; color: var(--color-muted); padding: 30px 12px; font-size: 14px; }
        .item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--color-border); }
        .item:last-child { border-bottom: none; padding-bottom: 4px; }
        .item:first-child { padding-top: 4px; }
        .item__img { width: 60px; height: 78px; object-fit: cover; border-radius: 6px; background: #f5f5f5; flex-shrink: 0; }
        .item__info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
        .item__name { font-size: 13px; font-weight: 500; line-height: 1.3; margin: 0 0 4px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .item__meta { font-size: 12px; color: var(--color-muted); }
        .item__price { font-size: 13px; font-weight: 600; color: var(--brand); letter-spacing: 0.5px; text-align: right; align-self: flex-start; flex-shrink: 0; }

        .totals { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--color-border); }
        .totals__row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; color: #555; }
        .totals__row--grand { font-size: 16px; font-weight: 700; color: #291409; padding-top: 12px; margin-top: 4px; border-top: 1px solid var(--color-border); }

        form { display: flex; flex-direction: column; gap: 12px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field--row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        label { font-size: 12px; font-weight: 500; color: #555; letter-spacing: 0.3px; }
        input, select, textarea {
            font-family: inherit; font-size: 14px; color: #291409;
            padding: 12px 14px; border: 1px solid var(--color-border); border-radius: 8px;
            background: #fafafa; outline: none;
            transition: border-color .2s ease, background .2s ease;
            width: 100%;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--brand); background: #fff; }
        textarea { resize: vertical; min-height: 70px; }

        .pay-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .pay {
            border: 1px solid var(--color-border); border-radius: 8px; padding: 14px 12px;
            text-align: center; cursor: pointer; background: #fafafa;
            font-size: 13px; font-weight: 500; color: #333;
            transition: all .2s ease;
        }
        .pay.active { border-color: var(--brand); background: #fff; color: var(--brand); font-weight: 600; box-shadow: 0 0 0 1px var(--brand) inset; }

        .place-btn {
            width: 100%; padding: 16px; background: var(--brand); color: #fff;
            border: none; border-radius: 8px; font-size: 13px; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
            margin-top: 24px; transition: background .25s ease;
            font-family: inherit;
        }
        .place-btn:hover:not(:disabled) { background: #3d1f0e; }
        .place-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .helper { font-size: 11px; color: var(--color-muted); text-align: center; margin-top: 12px; line-height: 1.5; }

        /* Confirmation overlay */
        .confirm {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            opacity: 0; visibility: hidden;
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
            transition: opacity .3s ease, visibility .3s ease;
        }
        .confirm.open { opacity: 1; visibility: visible; }
        .confirm__card {
            background: #fff; border-radius: 14px;
            max-width: 360px; width: 100%;
            padding: 32px 24px; text-align: center;
            transform: translateY(20px) scale(0.96); opacity: 0;
            transition: all .35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .confirm.open .confirm__card { transform: translateY(0) scale(1); opacity: 1; }
        .confirm__check {
            width: 64px; height: 64px; border-radius: 50%;
            background: var(--brand); color: #fff;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 18px;
        }
        .confirm__check svg { width: 32px; height: 32px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .confirm__title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .confirm__msg { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 6px; }
        .confirm__order { font-size: 12px; color: var(--brand); font-weight: 600; letter-spacing: 1px; margin-bottom: 22px; }
        .confirm__btn {
            width: 100%; padding: 14px; background: var(--brand); color: #fff;
            border: none; border-radius: 8px; font-size: 12px; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>
<div class="app">
    <header class="header">
        <button class="header__back" onclick="window.location.href='index.html'" aria-label="Back">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="header__title">Checkout</div>
        <div class="header__spacer"></div>
    </header>

    <div class="container">
        <div class="section-title">Order Summary</div>
        <div class="summary" id="summary"></div>

        <form id="checkoutForm" novalidate>
            <div class="section-title">Contact</div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" required placeholder="you@example.com">
            </div>
            <div class="field">
                <label for="phone">Phone</label>
                <input id="phone" type="tel" required placeholder="06 12 34 56 78">
            </div>

            <div class="section-title">Shipping Address</div>
            <div class="field--row">
                <div class="field">
                    <label for="firstName">First name</label>
                    <input id="firstName" type="text" required>
                </div>
                <div class="field">
                    <label for="lastName">Last name</label>
                    <input id="lastName" type="text" required>
                </div>
            </div>
            <div class="field">
                <label for="address">Address</label>
                <input id="address" type="text" required placeholder="Street, building, apt.">
            </div>
            <div class="field--row">
                <div class="field">
                    <label for="city">City</label>
                    <input id="city" type="text" required>
                </div>
                <div class="field">
                    <label for="postal">Postal code</label>
                    <input id="postal" type="text" required>
                </div>
            </div>
            <div class="field">
                <label for="country">Country</label>
                <select id="country" required>
                    <option value="MA" selected>Morocco</option>
                    <option value="FR">France</option>
                    <option value="ES">Spain</option>
                    <option value="DE">Germany</option>
                    <option value="GB">United Kingdom</option>
                    <option value="US">United States</option>
                </select>
            </div>
            <div class="field">
                <label for="notes">Order notes (optional)</label>
                <textarea id="notes" placeholder="Anything we should know?"></textarea>
            </div>

            <div class="section-title">Payment Method</div>
            <div class="pay-options" id="payOptions">
                <div class="pay active" data-pay="cod">Cash on Delivery</div>
                <div class="pay" data-pay="card">Credit Card</div>
            </div>

            <button type="submit" class="place-btn" id="placeBtn">Place Order</button>
            <p class="helper">By placing your order, you agree to WILD CLOTHING's terms of service and privacy policy.</p>
        </form>
    </div>
</div>

<div class="confirm" id="confirm">
    <div class="confirm__card">
        <div class="confirm__check">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2 class="confirm__title">Order Placed</h2>
        <p class="confirm__msg">Thanks for shopping with WILD CLOTHING. We'll send a confirmation to your email shortly.</p>
        <p class="confirm__order" id="orderRef"></p>
        <button class="confirm__btn" onclick="window.location.href='index.html'">Continue Shopping</button>
    </div>
</div>

<script>
    const SHIPPING = 30;
    function loadBag(){
        try { return JSON.parse(localStorage.getItem('mwBag')||'{}'); }
        catch(e){ return {}; }
    }
    function priceNum(p){ return parseFloat(String(p).replace(/[^0-9.]/g,''))||0; }
    function fmt(n){ return n.toFixed(2)+' DH'; }

    let BAG = loadBag();

    function render(){
        const sum = document.getElementById('summary');
        const ids = Object.keys(BAG);
        const placeBtn = document.getElementById('placeBtn');
        if(ids.length === 0){
            sum.innerHTML = '<div class="summary-empty">Your bag is empty. Add some items before checking out.</div>';
            placeBtn.disabled = true;
            return;
        }
        let subtotal = 0;
        const itemsHtml = ids.map(id => {
            const it = BAG[id];
            const line = priceNum(it.price) * it.qty;
            subtotal += line;
            return `<div class="item">
                <img class="item__img" src="${it.img}" alt="${it.name}" onerror="this.style.background='#eee'">
                <div class="item__info">
                    <div>
                        <h4 class="item__name">${it.name}</h4>
                        <p class="item__meta">Qty ${it.qty} &middot; ${it.price}</p>
                    </div>
                </div>
                <div class="item__price">${fmt(line)}</div>
            </div>`;
        }).join('');
        const total = subtotal + SHIPPING;
        sum.innerHTML = itemsHtml + `
            <div class="totals">
                <div class="totals__row"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
                <div class="totals__row"><span>Shipping</span><span>${fmt(SHIPPING)}</span></div>
                <div class="totals__row totals__row--grand"><span>Total</span><span>${fmt(total)}</span></div>
            </div>`;
        placeBtn.disabled = false;
    }
    render();

    // Payment selector
    document.getElementById('payOptions').addEventListener('click', (e) => {
        const t = e.target.closest('.pay');
        if(!t) return;
        document.querySelectorAll('.pay').forEach(p => p.classList.remove('active'));
        t.classList.add('active');
    });

    // Submit
    document.getElementById('checkoutForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const form = e.target;
        if(!form.checkValidity()){ form.reportValidity(); return; }
        if(Object.keys(BAG).length === 0) return;

        const ref = 'WC-' + Date.now().toString(36).toUpperCase();
        document.getElementById('orderRef').textContent = 'Order #' + ref;

        // Clear bag
        try { localStorage.removeItem('mwBag'); } catch(e) {}
        BAG = {};

        document.getElementById('confirm').classList.add('open');
        document.body.style.overflow = 'hidden';
    });
</script>
</body>
</html>
